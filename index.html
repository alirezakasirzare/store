<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بوتیک خوشکله</title>

    <!-- customize style -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- font awesome -->
    <link rel="stylesheet" href="./font/icon/css/fontawesome-all.min.css" />

    <!-- cdn bootstrap (js) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- start header -->
    <header class="main-header">
      <div class="main-header__nav">
        <div class="container-custom">
          <div class="main-header__nav__row" id="toggleSeatchPlace">
            <!-- right menu -->
            <ul class="main-header__nav__row__right">
              <li class="ps-1 pe-0 d-md-none">
                <a
                  href=""
                  class="main-header__nav__row__left__link"
                  data-bs-toggle="offcanvas"
                  data-bs-target="#mobile-menu"
                  aria-controls="offcanvasRight"
                >
                  <i class="fal fa-bars fs-5"></i>
                </a>
              </li>
              <li class="px-0 ps-lg-3 pe-lg-1">
                <a href="">
                  <img
                    src="./image/logo.png"
                    alt="logo"
                    class="main-header__nav__row__right__logo"
                  />
                </a>
              </li>
              <li class="px-1 d-none d-md-block">
                <a
                  href=""
                  class="main-header__nav__row__right__link"
                  type="button"
                  id="dropdownMenuButton1"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <span>شال</span>
                  <i class="fal fa-angle-down"></i>
                </a>
                <ul
                  class="dropdown-menu text-end"
                  aria-labelledby="dropdownMenuButton1"
                >
                  <li>
                    <a class="dropdown-item" href="#">شال موهر دو رو زمستانه</a>
                  </li>
                  <li><a class="dropdown-item" href="#">پلیسه</a></li>
                </ul>
              </li>
              <li class="px-1 d-none d-md-block">
                <a
                  href=""
                  class="main-header__nav__row__right__link"
                  type="button"
                  id="dropdownMenuButton2"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <span>روسری</span>
                  <i class="fal fa-angle-down"></i>
                </a>
                <ul
                  class="dropdown-menu text-end"
                  aria-labelledby="dropdownMenuButton2"
                >
                  <li>
                    <a class="dropdown-item" href="#">بی‌بی اسکارف</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">روسری قواره ۱۰۰*۱۰۰</a>
                  </li>
                </ul>
              </li>
              <li class="px-1 d-none d-md-block">
                <a href="" class="main-header__nav__row__right__link"
                  >ارتباط با ما</a
                >
              </li>
              <li class="px-1 d-none d-md-block">
                <a href="" class="main-header__nav__row__right__link"
                  >شال دو رو بهاره</a
                >
              </li>
            </ul>
            <!-- left menu -->
            <ul class="main-header__nav__row__left">
              <li class="px-0 ps-lg-1">
                <a
                  href="#"
                  class="main-header__nav__row__left__link"
                  onclick="handelSearchForm(event)"
                >
                  <i class="fal fa-search fs-5"></i>
                </a>
              </li>
              <li class="ps-0 pe-1 px-lg-1">
                <a href="" class="main-header__nav__row__left__link">
                  <i class="fal fa-shopping-basket fs-5"></i>
                </a>
              </li>
              <li class="px-1 d-none d-md-block">
                <a href="" class="main-header__nav__row__left__link"> عضویت </a>
              </li>
              <li>
                <div class="vr d-none d-md-block"></div>
              </li>
              <li class="px-1 d-none d-md-block">
                <a href="" class="main-header__nav__row__left__link">
                  وارد شوید
                </a>
              </li>
            </ul>
            <!-- search item -->
            <form
              action="#"
              method="get"
              class="main-header__nav__row__search"
              id="formSearch"
            >
              <input type="search" placeholder="نام محصول یا دسته" />
              <button
                class="main-header__nav__row__search__submit"
                type="submit"
              >
                جستجو
              </button>
            </form>
          </div>
        </div>
      </div>
    </header>
    <!-- end header -->
    <!-- start mobile menu -->
    <!-- <nav class="mobile-menu">
      <div class="mobile-menu__close-button"></div>
    </nav> -->
    <div
      class="offcanvas offcanvas-end mobile-menu"
      tabindex="-1"
      id="mobile-menu"
      aria-labelledby="offcanvasRightLabel"
    >
      <!-- title -->
      <div class="offcanvas-header">
        <h5 id="offcanvasRightLabel">منو</h5>
        <button
          type="button"
          class="btn-close text-reset btn-close-white"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <!-- menu -->
        <ul class="mobile-menu__list">
          <li>
            <a
              class="mobile-menu__list__link"
              data-bs-toggle="collapse"
              href="#collapseExample"
              role="button"
              aria-expanded="false"
              aria-controls="collapseExample"
              >شال</a
            >
            <div class="collapse" id="collapseExample">
              <ul class="mobile-collapse">
                <li class="mt-1">
                  <a href="#" class="mobile-menu__list__link">روسری</a>
                </li>
                <li class="mt-1">
                  <a href="#" class="mobile-menu__list__link">ارتباط با ما</a>
                </li>
              </ul>
            </div>
          </li>
          <li><a href="#" class="mobile-menu__list__link">روسری</a></li>
          <li><a href="#" class="mobile-menu__list__link">ارتباط با ما</a></li>
          <li>
            <a href="#" class="mobile-menu__list__link">شال دو رو بهاره</a>
          </li>
        </ul>
        <!-- login -->
        <hr />
        <ul class="mobile-menu__list mobile-menu__list--login">
          <li class="mobile-menu__list__item">
            <a href="#" class="mobile-menu__list__link">ورود</a>
          </li>
          <li class="mobile-menu__list__item">
            <a href="#" class="mobile-menu__list__link">ثبت نام</a>
          </li>
        </ul>
      </div>
      <!-- image -->
      <img
        src="./image/mobile-menu.svg"
        alt="mobile menu"
        class="mobile-menu__image"
        loading="lazy"
      />
    </div>
    <!-- end mobile menu -->
    <!-- script js -->
    <script src="./js/main.js"></script>
  </body>
</html>
