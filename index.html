<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بوتیک خوشکله</title>

    <!-- customize style -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- font awesome -->
    <link rel="stylesheet" href="./font/icon/css/fontawesome-all.min.css" />

    <!-- cdn bootstrap (js) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- start header -->
    <header class="main-header">
      <div class="main-header__nav">
        <div class="container-custom">
          <div class="main-header__nav__row">
            <!-- right menu -->
            <ul class="main-header__nav__row__right">
              <li class="px-3">
                <a href="">
                  <img
                    src="./image/logo.png"
                    alt="logo"
                    class="main-header__nav__row__right__logo"
                  />
                </a>
              </li>
              <li class="px-3 d-none d-lg-block">
                <a
                  href=""
                  class="main-header__nav__row__right__link"
                  type="button"
                  id="dropdownMenuButton1"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <span>شال</span>
                  <i class="fal fa-angle-down"></i>
                </a>
                <ul
                  class="dropdown-menu text-end"
                  aria-labelledby="dropdownMenuButton1"
                >
                  <li>
                    <a class="dropdown-item" href="#">شال موهر دو رو زمستانه</a>
                  </li>
                  <li><a class="dropdown-item" href="#">پلیسه</a></li>
                </ul>
              </li>
              <li class="px-3 d-none d-lg-block">
                <a
                  href=""
                  class="main-header__nav__row__right__link"
                  type="button"
                  id="dropdownMenuButton2"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <span>روسری</span>
                  <i class="fal fa-angle-down"></i>
                </a>
                <ul
                  class="dropdown-menu text-end"
                  aria-labelledby="dropdownMenuButton2"
                >
                  <li>
                    <a class="dropdown-item" href="#">بی‌بی اسکارف</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">روسری قواره ۱۰۰*۱۰۰</a>
                  </li>
                </ul>
              </li>
              <li class="px-3 d-none d-lg-block">
                <a href="" class="main-header__nav__row__right__link"
                  >ارتباط با ما</a
                >
              </li>
              <li class="px-3 d-none d-lg-block">
                <a href="" class="main-header__nav__row__right__link"
                  >شال دو رو بهاره</a
                >
              </li>
            </ul>
            <!-- left menu -->
            <ul class="main-header__nav__row__left">
              <li class="px-1">
                <a href="" class="main-header__nav__row__left__link">
                  <i class="fal fa-search fs-5"></i>
                </a>
              </li>
              <li class="px-1">
                <a href="" class="main-header__nav__row__left__link">
                  <i class="fal fa-shopping-basket fs-5"></i>
                </a>
              </li>
              <li class="px-1 d-none d-lg-block">
                <a href="" class="main-header__nav__row__left__link"> عضویت </a>
              </li>
              <li>
                <div class="vr d-none d-lg-block"></div>
              </li>
              <li class="px-1 d-none d-lg-block">
                <a href="" class="main-header__nav__row__left__link">
                  وارد شوید
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <!-- end header -->
    <!-- script js -->
    <script src="./js/main.js"></script>
  </body>
</html>
